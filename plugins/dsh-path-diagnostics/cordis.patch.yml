# The bundle inserts an optional host loader row. The loader invokes the
# package's default export (`apply`) with this row's config; `apply` observes
# the verified `tools/post-execute` seam and disposes its listener with the
# profile lifecycle.
#
# Keep the row disabled until the profile explicitly opts into read-only path
# diagnostics. The starter limits below are finite and fail closed.

- insert:
    - id: path-diagnostics
      name: dsh-path-diagnostics
      config:
        enabled: false
        readOnly: true
        maxDepth: 4
        maxCandidates: 8
        maxSearchEntries: 2000
        suggestOnlyWhenUnique: true
